# XcodeGen 工程定义：CI 上用 `xcodegen` 生成 Waimai.xcodeproj 后编译
# 安装：brew install xcodegen
name: Waimai

options:
  bundleIdPrefix: com.waimai
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: "YES"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: "NO"
    CLANG_ENABLE_MODULES: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"

targets:
  Waimai:
    type: application
    platform: iOS
    sources:
      - path: Waimai
    info:
      path: Waimai/Info.plist
    settings:
      base:
        PRODUCT_NAME: Waimai
        PRODUCT_BUNDLE_IDENTIFIER: com.waimai.app
        INFOPLIST_FILE: Waimai/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # CI 出未签名 IPA，本地用自己的免费 Apple ID 签名安装
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: "YES"
