name: 后端测试

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/server.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install

      - name: 冒烟测试（全链路 + 账号 + 三端 DOM）
        env:
          PORT: 3000
        run: |
          npm start &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3000/api/bootstrap >/dev/null && break
            sleep 1
          done
          npm test
          npm run test:auth
          npm run test:switch
          npm run test:dom
