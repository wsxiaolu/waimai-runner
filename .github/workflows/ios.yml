name: 构建 iOS IPA

on:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Xcode 26 归档并导出 IPA
    # macos-26 自带 Xcode 26 + iOS 26 SDK（液态玻璃 API 的最低要求）
    # 注意：macOS runner 只在公开仓库免费，私有仓库会消耗付费额度
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 工具链版本
        run: |
          xcodebuild -version
          swift --version 2>/dev/null || xcrun swift --version

      - name: 安装 XcodeGen
        run: |
          brew install xcodegen 2>/dev/null || brew upgrade xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate --spec project.yml --project Waimai.xcodeproj

      - name: 归档（不签名）
        working-directory: ios
        run: |
          xcodebuild \
            -project Waimai.xcodeproj \
            -scheme Waimai \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Waimai.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            archive

      - name: 打包为 IPA
        run: |
          mkdir -p dist "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Waimai.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry Waimai-iOS.ipa Payload)
          mv "$RUNNER_TEMP/Waimai-iOS.ipa" dist/Waimai-iOS-unsigned.ipa
          ls -lh dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Waimai-iOS-unsigned
          path: dist/Waimai-iOS-unsigned.ipa
          retention-days: 30

      - name: 打 tag 时附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Waimai-iOS-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
